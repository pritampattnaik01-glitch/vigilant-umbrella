from pathlib import Path
import zipfile, shutil

# Recreate a complete GitHub-ready package with the existing site plus an
# automatic Render deployment workflow. The workflow uses a GitHub secret
# called RENDER_DEPLOY_HOOK_URL, so no password/API token is stored in code.
src = Path("/mnt/data/soap_store")
out = Path("/mnt/data/prakriti-soaps-github-ready")
if out.exists():
    shutil.rmtree(out)
shutil.copytree(src, out)

wf = out / ".github" / "workflows"
wf.mkdir(parents=True, exist_ok=True)

(wf / "deploy.yml").write_text(r'''name: Deploy Prakriti Soaps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate server
        run: node --check server.js

      - name: Validate frontend
        run: |
          test -f public/index.html
          test -f public/style.css
          test -f public/script.js

      - name: Trigger Render deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Deployment note
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured."
            echo "Add the Render Deploy Hook URL as a GitHub Actions secret."
          else
            echo "Render deployment triggered successfully."
          fi
''', encoding="utf-8")

(out / "render.yaml").write_text(r'''services:
  - type: web
    name: prakriti-soaps
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: ORDER_EMAIL
        value: pritampattnaik01@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
''', encoding="utf-8")

(out / "GITHUB-DEPLOY.md").write_text(r'''# GitHub → Render deployment

## 1. Upload this project to GitHub

Keep `.github/workflows/deploy.yml` in the repository.

## 2. Create the Render service

Create a new Web Service from the GitHub repository and use:

- Build Command: `npm ci`
- Start Command: `npm start`

`render.yaml` is also included for the service configuration.

## 3. Add environment variables in Render

Set:

- `ORDER_EMAIL` = `pritampattnaik01@gmail.com`
- `SMTP_HOST` = `smtp.gmail.com`
- `SMTP_PORT` = `465`
- `SMTP_SECURE` = `true`
- `SMTP_USER` = your Gmail address
- `SMTP_PASS` = your Gmail App Password

Do not put your normal Gmail password in GitHub or the source code.

## 4. Optional GitHub Actions trigger

In Render, create a Deploy Hook for the service.

In GitHub:
Settings → Secrets and variables → Actions → New repository secret

Name:
`RENDER_DEPLOY_HOOK_URL`

Value:
the Render Deploy Hook URL.

Then every push to `main` will validate the project and trigger a Render deployment.

## 5. Orders

The checkout form sends the order from the deployed Node.js server to:
`pritampattnaik01@gmail.com`
''', encoding="utf-8")

zip_path = Path("/mnt/data/prakriti-soaps-github-ready.zip")
with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
    for p in out.rglob("*"):
        if p.is_file():
            z.write(p, p.relative_to(out))

print(zip_path)
