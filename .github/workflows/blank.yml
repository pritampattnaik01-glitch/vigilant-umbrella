from pathlib import Path
import zipfile

base = Path("/mnt/data/github-workflow")
workflow_dir = base / ".github" / "workflows"
workflow_dir.mkdir(parents=True, exist_ok=True)

workflow = """name: Build and Check Soap Store

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Check frontend files
        run: |
          test -f public/index.html
          test -f public/style.css
          test -f public/script.js

      - name: Verify project
        run: echo "Prakriti Soaps website checks passed successfully."
"""

file_path = workflow_dir / "node.yml"
file_path.write_text(workflow, encoding="utf-8")

zip_path = Path("/mnt/data/github-actions-workflow.zip")
with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as z:
    z.write(file_path, ".github/workflows/node.yml")

print(zip_path)
